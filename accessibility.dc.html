<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesibilidad — Priscila by CimaCove</title>
<meta name="description" content="Compromiso de accesibilidad del sitio priscila.cimacove.com, medidas aplicadas, limitaciones conocidas y canales para reportar barreras.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://priscila.cimacove.com/accessibility">
<script src="/vendor-map.js"></script>
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"></link>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"></link>
  <style>
    :root{
      --obsidian:#0b0a08;--surface:#111009;--champagne:#cda86a;--ivory:#f5efe4;
      --text-secondary:#c6bcaa;--text-muted:#8a7f6d;--rose-gold:#dda893;
      --rose-gold-line:rgba(221,168,147,0.34);--border-subtle:#241f16;--focus-ring:#6f93c9;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:#0b0a08;}
    ::selection{background:#cda86a;color:#0b0a08;}
    .skip-link{position:absolute;left:-9999px;top:0;z-index:100;background:var(--champagne);color:var(--obsidian);padding:12px 20px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;text-decoration:none;}
    .skip-link:focus{left:0;}
    .legal{max-width:74ch;margin:0 auto;padding:clamp(90px,11vw,130px) clamp(22px,6vw,48px) clamp(60px,8vw,100px);}
    .legal h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(27px,4vw,42px);line-height:1.18;color:var(--ivory);margin:0 0 14px 0;text-wrap:balance;}
    .legal h2{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(19px,2.3vw,26px);line-height:1.3;color:var(--ivory);margin:44px 0 14px 0;padding-top:22px;border-top:1px solid var(--border-subtle);text-wrap:balance;}
    .legal p{font-size:clamp(14.5px,1.05vw,16px);line-height:1.8;color:var(--text-secondary);margin:0 0 16px 0;text-wrap:pretty;}
    .legal ul{margin:0 0 18px 0;padding:0;list-style:none;}
    .legal li{font-size:clamp(14px,1vw,15.5px);line-height:1.72;color:var(--text-secondary);padding:7px 0 7px 20px;position:relative;border-bottom:1px solid #1c1810;}
    .legal li::before{content:"·";position:absolute;left:4px;top:7px;color:var(--rose-gold);}
    .legal a{color:var(--champagne);}
    .legal a:focus-visible,.skip-link:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}
    .eyebrow{font-size:11px;letter-spacing:0.3em;color:var(--champagne);text-transform:uppercase;margin-bottom:16px;}
    .effective{font-size:12.5px;color:var(--text-muted);margin:0 0 30px 0;letter-spacing:0.04em;}
    .callout{background:var(--surface);border:1px solid var(--border-subtle);border-top:1px solid var(--rose-gold-line);border-radius:8px;padding:clamp(20px,3vw,28px);margin:0 0 20px 0;}
    .callout p:last-child{margin-bottom:0;}
    .topnav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px clamp(20px,4vw,44px);background:rgba(9,7,5,0.94);border-bottom:1px solid var(--border-subtle);}
    .home{font-family:'Playfair Display',serif;font-size:13px;letter-spacing:0.18em;color:var(--text-muted);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;}
    .home:hover{color:var(--champagne);}
    .langbtn{background:none;border:none;font-size:13px;letter-spacing:0.1em;cursor:pointer;font-weight:700;font-family:'Manrope',sans-serif;padding:4px 10px;min-height:44px;min-width:44px;}
    footer{padding:34px clamp(22px,6vw,48px);border-top:1px solid var(--border-subtle);display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:space-between;align-items:center;}
    footer a{font-size:12.5px;color:var(--text-secondary);text-decoration:none;border-bottom:1px solid var(--rose-gold-line);min-height:44px;display:inline-flex;align-items:center;}
    footer a:hover{color:#f2d9ad;}
    @media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important;animation-iteration-count:1 !important;}}
  </style>
</helmet>
<div style="font-family:'Manrope',sans-serif;background:#0b0a08;color:#f2ece1;width:100%;overflow-x:hidden;">
  <a href="#main" class="skip-link">{{ t.skip }}</a>
  <nav class="topnav" aria-label="{{ t.navLabel }}">
    <a href="/" class="home">← {{ t.backHome }}</a>
    <div style="display:flex;gap:4px;align-items:center;">
      <button class="langbtn" aria-pressed="{{ isEs }}" onClick="{{ setLangEs }}" lang="es" style="{{ esStyle }}">ES</button>
      <span style="color:#584f43;" aria-hidden="true">|</span>
      <button class="langbtn" aria-pressed="{{ isEn }}" onClick="{{ setLangEn }}" lang="en" style="{{ enStyle }}">EN</button>
    </div>
  </nav>

  <main id="main" tabindex="-1" class="legal" style="outline:none;">
    <div class="eyebrow">{{ t.eyebrow }}</div>
    <h1>{{ t.title }}</h1>
    <p class="effective">{{ t.effective }}</p>

    <div class="callout">
      <sc-for list="{{ t.intro }}" as="p" hint-placeholder-count="2">
        <p>{{ p }}</p>
      </sc-for>
    </div>

    <sc-for list="{{ t.sections }}" as="sec" hint-placeholder-count="7">
      <section>
        <h2>{{ sec.h }}</h2>
        <sc-for list="{{ sec.p }}" as="para" hint-placeholder-count="2">
          <p>{{ para }}</p>
        </sc-for>
        <sc-if value="{{ sec.hasList }}" hint-placeholder-val="{{ false }}">
          <ul>
            <sc-for list="{{ sec.list }}" as="li" hint-placeholder-count="6">
              <li>{{ li }}</li>
            </sc-for>
          </ul>
        </sc-if>
      </section>
    </sc-for>

    <h2>{{ t.contactTitle }}</h2>
    <sc-for list="{{ t.contactBody }}" as="p" hint-placeholder-count="2">
      <p>{{ p }}</p>
    </sc-for>
    <p>
      <a href="{{ waLink }}" target="_blank" rel="noopener noreferrer">{{ t.waLabel }}</a>
      · <a href="/#contact-form">{{ t.formLabel }}</a>
    </p>
  </main>

  <footer>
    <span style="font-size:12px;color:#665c4c;">{{ t.footerBusiness }}</span>
    <nav aria-label="{{ t.legalNavLabel }}" style="display:flex;flex-wrap:wrap;gap:8px 20px;">
      <a href="/privacy">{{ t.privacyLabel }}</a>
      <a href="/terms">{{ t.termsLabel }}</a>
      <a href="/accessibility" aria-current="page">{{ t.accessibilityLabel }}</a>
    </nav>
  </footer>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // States a commitment and lists what was actually implemented and what is still open.
  // Deliberately claims NO WCAG conformance level and NO certification.
  state = { lang: 'es' };

  copy = {
    es: {
      skip: 'Saltar al contenido principal',
      navLabel: 'Navegación',
      legalNavLabel: 'Enlaces legales',
      backHome: 'Volver al inicio',
      eyebrow: 'Legal',
      title: 'Declaración de Accesibilidad',
      effective: 'Última actualización: 14 de agosto de 2026',
      intro: [
        'CimaCove LLC quiere que este sitio pueda usarlo la mayor cantidad de personas posible, incluidas quienes navegan con teclado, lector de pantalla, zoom elevado o preferencias de movimiento reducido.',
        'No declaramos ninguna certificación ni nivel de conformidad WCAG. Lo que sigue es una descripción honesta de lo que está implementado y de lo que todavía falta.'
      ],
      sections: [
        {
          h: 'Qué está implementado',
          p: ['Estas medidas están aplicadas y verificadas en el sitio:'],
          list: [
            'Estructura semántica con landmarks de navegación, contenido principal y pie de página.',
            'Enlace “Saltar al contenido principal” como primer elemento enfocable de cada página.',
            'Navegación completa por teclado en enlaces, botones, pestañas de servicios, acordeón de preguntas frecuentes y formulario.',
            'Indicador de foco visible y con contraste propio en todos los elementos interactivos.',
            'El panel de servicios se cierra con la tecla Escape.',
            'Textos alternativos descriptivos en español e inglés para las imágenes informativas.',
            'Las imágenes y vídeos puramente decorativos están ocultos a las tecnologías de asistencia y no son enfocables.',
            'Objetivos táctiles de al menos 44 por 44 píxeles en los controles interactivos.',
            'Los errores del formulario se anuncian a los lectores de pantalla y los campos se marcan como inválidos.',
            'Los mensajes de éxito y error del formulario se comunican mediante regiones activas.',
            'Se respeta “prefers-reduced-motion”: las animaciones se neutralizan y el vídeo del hero se sustituye por una imagen fija.',
            'El sitio no reproduce sonido automáticamente. La música ambiental sólo suena si la activas y se puede desactivar y regular.',
            'Texto redimensionable y contenido que se reajusta sin desplazamiento horizontal en anchos de 375 píxeles en adelante.',
            'El idioma de la página se declara y se actualiza al cambiar entre español e inglés.'
          ]
        },
        {
          h: 'Limitaciones conocidas',
          p: ['Somos transparentes sobre lo que aún no está resuelto:'],
          list: [
            'Los vídeos del sitio se reproducen siempre silenciados y son decorativos, por lo que hoy no transmiten información hablada. Si en el futuro se publica un vídeo con voz, hará falta añadir subtítulos y transcripción; todavía no existen y no vamos a inventarlos.',
            'El sitio no ha sido auditado por un tercero independiente ni evaluado con usuarios de tecnología de asistencia.',
            'Algunos servicios externos enlazados desde el sitio, como WhatsApp y Hotmart, tienen su propia accesibilidad, que no controlamos.'
          ]
        },
        {
          h: 'Compatibilidad',
          p: ['El sitio está pensado para funcionar en versiones recientes de los navegadores de escritorio y móviles más habituales, junto con las tecnologías de asistencia que estos incorporan. No podemos garantizar el comportamiento en navegadores o versiones que ya no reciben mantenimiento.']
        },
        {
          h: 'Mejora continua',
          p: ['La accesibilidad de este sitio se revisa cuando se modifica su contenido o su estructura. Los problemas que nos reportéis se priorizan según cuánto impidan completar una tarea.']
        }
      ],
      contactTitle: 'Reportar una barrera de accesibilidad',
      contactBody: [
        'Si encuentras una parte del sitio que no puedes usar, cuéntanoslo. Es la forma más rápida de que se corrija.',
        'Si puedes, indícanos qué página, qué intentabas hacer y qué navegador o tecnología de asistencia usabas. Respondemos de forma manual y personal.'
      ],
      waLabel: 'Escribir por WhatsApp',
      formLabel: 'Usar el formulario de contacto',
      footerBusiness: 'CimaCove LLC — Arizona, Estados Unidos. Marca: Priscila by CimaCove.',
      privacyLabel: 'Política de Privacidad',
      termsLabel: 'Términos de Uso',
      accessibilityLabel: 'Accesibilidad',
      waMsg: 'Hola. Quiero reportar una barrera de accesibilidad en priscila.cimacove.com.'
    },
    en: {
      skip: 'Skip to main content',
      navLabel: 'Navigation',
      legalNavLabel: 'Legal links',
      backHome: 'Back to home',
      eyebrow: 'Legal',
      title: 'Accessibility Statement',
      effective: 'Last updated: 14 August 2026',
      intro: [
        'CimaCove LLC wants this site to be usable by as many people as possible, including those browsing with a keyboard, a screen reader, high zoom, or reduced-motion preferences.',
        'We claim no certification and no WCAG conformance level. What follows is an honest description of what is implemented and what is still missing.'
      ],
      sections: [
        {
          h: 'What is implemented',
          p: ['These measures are in place and verified on the site:'],
          list: [
            'Semantic structure with navigation, main content and footer landmarks.',
            '“Skip to main content” link as the first focusable element on every page.',
            'Full keyboard navigation across links, buttons, service tabs, the FAQ accordion and the form.',
            'A visible, separately contrasted focus indicator on every interactive element.',
            'The services panel closes with the Escape key.',
            'Descriptive alternative text in Spanish and English for informative images.',
            'Purely decorative images and video are hidden from assistive technology and are not focusable.',
            'Touch targets of at least 44 by 44 pixels on interactive controls.',
            'Form errors are announced to screen readers and fields are marked invalid.',
            'Form success and error messages are communicated through live regions.',
            '“prefers-reduced-motion” is respected: animations are neutralised and the hero video is replaced by a still image.',
            'The site never plays sound automatically. The ambience music plays only if you enable it, and it can be muted and adjusted.',
            'Resizable text and content that reflows without horizontal scrolling from 375 pixels wide upwards.',
            'The page language is declared and updated when switching between Spanish and English.'
          ]
        },
        {
          h: 'Known limitations',
          p: ['We are transparent about what is not solved yet:'],
          list: [
            'The site’s videos always play muted and are decorative, so today they convey no spoken information. If a video with speech is published in future, captions and a transcript will be required; they do not exist yet and we will not invent them.',
            'The site has not been audited by an independent third party, nor tested with assistive technology users.',
            'Some external services linked from the site, such as WhatsApp and Hotmart, have their own accessibility, which we do not control.'
          ]
        },
        {
          h: 'Compatibility',
          p: ['The site is intended to work in recent versions of the most common desktop and mobile browsers, together with the assistive technologies they include. We cannot guarantee behaviour in browsers or versions that no longer receive maintenance.']
        },
        {
          h: 'Ongoing improvement',
          p: ['This site’s accessibility is reviewed whenever its content or structure changes. Issues you report are prioritised by how much they prevent completing a task.']
        }
      ],
      contactTitle: 'Report an accessibility barrier',
      contactBody: [
        'If you find part of the site you cannot use, please tell us. It is the fastest way to get it fixed.',
        'If you can, tell us which page, what you were trying to do, and which browser or assistive technology you were using. We reply manually and personally.'
      ],
      waLabel: 'Message on WhatsApp',
      formLabel: 'Use the contact form',
      footerBusiness: 'CimaCove LLC — Arizona, United States. Brand: Priscila by CimaCove.',
      privacyLabel: 'Privacy Policy',
      termsLabel: 'Terms of Use',
      accessibilityLabel: 'Accessibility',
      waMsg: 'Hello. I would like to report an accessibility barrier on priscila.cimacove.com.'
    }
  };

  syncLang = () => {
    try {
      document.documentElement.setAttribute('lang', this.state.lang);
      document.title = this.copy[this.state.lang].title + ' — Priscila by CimaCove';
    } catch (e) {}
  };
  setLang = (l) => this.setState({ lang: l }, this.syncLang);

  renderVals() {
    const s = this.state;
    const t = this.copy[s.lang];
    const sections = t.sections.map((sec) => ({
      h: sec.h,
      p: sec.p || [],
      list: sec.list || [],
      hasList: !!(sec.list && sec.list.length)
    }));
    return {
      t: { ...t, sections },
      isEs: s.lang === 'es', isEn: s.lang === 'en',
      setLangEs: () => this.setLang('es'), setLangEn: () => this.setLang('en'),
      esStyle: { color: s.lang === 'es' ? '#cda86a' : '#8a7f6d' },
      enStyle: { color: s.lang === 'en' ? '#cda86a' : '#8a7f6d' },
      waLink: `https://wa.me/16027720124?text=${encodeURIComponent(t.waMsg)}`
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Política de Privacidad — CimaCove Digital</title>
<meta name="description" content="Cómo CimaCove LLC, operando CimaCove Digital, trata los datos recogidos en digital.cimacove.com.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://digital.cimacove.com/privacy">
<script src="/vendor-map.js"></script>
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"></link>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"></link>
  <style>
    :root{
      --obsidian:#0b0a08;--surface:#111009;--surface-raised:#17140d;--champagne:#cda86a;
      --ivory:#f5efe4;--text-secondary:#c6bcaa;--text-muted:#8a7f6d;--rose-gold:#dda893;
      --rose-gold-line:rgba(221,168,147,0.34);--border:#3a3122;--border-subtle:#241f16;--focus-ring:#6f93c9;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:#0b0a08;}
    ::selection{background:#cda86a;color:#0b0a08;}
    .skip-link{position:absolute;left:-9999px;top:0;z-index:100;background:var(--champagne);color:var(--obsidian);padding:12px 20px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;text-decoration:none;}
    .skip-link:focus{left:0;}
    .legal{max-width:74ch;margin:0 auto;padding:clamp(90px,11vw,130px) clamp(22px,6vw,48px) clamp(60px,8vw,100px);}
    .legal h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(27px,4vw,42px);line-height:1.18;color:var(--ivory);margin:0 0 14px 0;text-wrap:balance;}
    .legal h2{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(19px,2.3vw,26px);line-height:1.3;color:var(--ivory);margin:44px 0 14px 0;padding-top:22px;border-top:1px solid var(--border-subtle);text-wrap:balance;}
    .legal p{font-size:clamp(14.5px,1.05vw,16px);line-height:1.8;color:var(--text-secondary);margin:0 0 16px 0;text-wrap:pretty;}
    .legal ul{margin:0 0 18px 0;padding:0;list-style:none;}
    .legal li{font-size:clamp(14px,1vw,15.5px);line-height:1.72;color:var(--text-secondary);padding:7px 0 7px 20px;position:relative;border-bottom:1px solid #1c1810;}
    .legal li::before{content:"·";position:absolute;left:4px;top:7px;color:var(--rose-gold);}
    .legal a{color:var(--champagne);}
    .legal a:focus-visible,.skip-link:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}
    .eyebrow{font-size:11px;letter-spacing:0.3em;color:var(--champagne);text-transform:uppercase;margin-bottom:16px;}
    .effective{font-size:12.5px;color:var(--text-muted);margin:0 0 30px 0;letter-spacing:0.04em;}
    .callout{background:var(--surface);border:1px solid var(--border-subtle);border-top:1px solid var(--rose-gold-line);border-radius:8px;padding:clamp(20px,3vw,28px);margin:0 0 20px 0;}
    .callout p:last-child{margin-bottom:0;}
    .topnav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px clamp(20px,4vw,44px);background:rgba(9,7,5,0.94);border-bottom:1px solid var(--border-subtle);}
    .home{font-family:'Playfair Display',serif;font-size:13px;letter-spacing:0.18em;color:var(--text-muted);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;}
    .home:hover{color:var(--champagne);}
    .langbtn{background:none;border:none;font-size:13px;letter-spacing:0.1em;cursor:pointer;font-weight:700;font-family:'Manrope',sans-serif;padding:4px 10px;min-height:44px;min-width:44px;}
    footer{padding:34px clamp(22px,6vw,48px);border-top:1px solid var(--border-subtle);display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:space-between;align-items:center;}
    footer a{font-size:12.5px;color:var(--text-secondary);text-decoration:none;border-bottom:1px solid var(--rose-gold-line);min-height:44px;display:inline-flex;align-items:center;}
    footer a:hover{color:#f2d9ad;}
    @media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important;animation-iteration-count:1 !important;}}
  </style>
</helmet>
<div style="font-family:'Manrope',sans-serif;background:#0b0a08;color:#f2ece1;width:100%;overflow-x:hidden;">
  <a href="#main" class="skip-link">{{ t.skip }}</a>
  <nav class="topnav" aria-label="{{ t.navLabel }}">
    <a href="/" class="home">← {{ t.backHome }}</a>
    <div style="display:flex;gap:4px;align-items:center;">
      <button class="langbtn" aria-pressed="{{ isEs }}" onClick="{{ setLangEs }}" lang="es" style="{{ esStyle }}">ES</button>
      <span style="color:#584f43;" aria-hidden="true">|</span>
      <button class="langbtn" aria-pressed="{{ isEn }}" onClick="{{ setLangEn }}" lang="en" style="{{ enStyle }}">EN</button>
    </div>
  </nav>

  <main id="main" tabindex="-1" class="legal" style="outline:none;">
    <div class="eyebrow">{{ t.eyebrow }}</div>
    <h1>{{ t.title }}</h1>
    <p class="effective">{{ t.effective }}</p>

    <div class="callout">
      <sc-for list="{{ t.intro }}" as="p" hint-placeholder-count="2">
        <p>{{ p }}</p>
      </sc-for>
    </div>

    <sc-for list="{{ t.sections }}" as="sec" hint-placeholder-count="16">
      <section>
        <h2>{{ sec.h }}</h2>
        <sc-for list="{{ sec.p }}" as="para" hint-placeholder-count="2">
          <p>{{ para }}</p>
        </sc-for>
        <sc-if value="{{ sec.hasList }}" hint-placeholder-val="{{ false }}">
          <ul>
            <sc-for list="{{ sec.list }}" as="li" hint-placeholder-count="4">
              <li>{{ li }}</li>
            </sc-for>
          </ul>
        </sc-if>
      </section>
    </sc-for>

    <h2>{{ t.contactTitle }}</h2>
    <sc-for list="{{ t.contactBody }}" as="p" hint-placeholder-count="2">
      <p>{{ p }}</p>
    </sc-for>
    <p>
      <a href="{{ waLink }}" target="_blank" rel="noopener noreferrer">{{ t.waLabel }}</a>
      · <a href="/#contact-form">{{ t.formLabel }}</a>
    </p>
  </main>

  <footer>
    <span style="font-size:12px;color:#665c4c;">{{ t.footerBusiness }}</span>
    <nav aria-label="{{ t.legalNavLabel }}" style="display:flex;flex-wrap:wrap;gap:8px 20px;">
      <a href="/privacy" aria-current="page">{{ t.privacyLabel }}</a>
      <a href="/terms">{{ t.termsLabel }}</a>
      <a href="/accessibility">{{ t.accessibilityLabel }}</a>
    </nav>
  </footer>
</div>
</x-dc>

    try {
      document.documentElement.setAttribute('lang', this.state.lang);
      document.title = this.copy[this.state.lang].title + ' — CimaCove Digital';
    } catch (e) {}
  };
  setLang = (l) => this.setState({ lang: l }, this.syncLang);

  renderVals() {
    const s = this.state;
    const t = this.copy[s.lang];
    const sections = t.sections.map((sec) => ({
      h: sec.h,
      p: sec.p || [],
      list: sec.list || [],
      hasList: !!(sec.list && sec.list.length)
    }));
    return {
      t: { ...t, sections },
      isEs: s.lang === 'es', isEn: s.lang === 'en',
      setLangEs: () => this.setLang('es'), setLangEn: () => this.setLang('en'),
      esStyle: { color: s.lang === 'es' ? '#cda86a' : '#8a7f6d' },
      enStyle: { color: s.lang === 'en' ? '#cda86a' : '#8a7f6d' },
      waLink: `https://wa.me/16027720124?text=${encodeURIComponent(t.waMsg)}`
    };
  }
}
</script>
